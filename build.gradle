plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.16'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.ainjob'
version = '0.0.1-SNAPSHOT'
description = 'AINJOB ATS API - 합격자 필터 / 상태 전이 / 상태변경 알림'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    // 영속 계층은 Spring Data JPA. starter-jdbc 는 이 스타터가 전이 의존성으로 가져오므로
    // 별도로 선언하지 않는다(테스트의 JdbcTemplate 검증 코드는 그대로 동작한다).
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-mail'

    // 인증: "company_id 는 요청이 아니라 검증된 JWT 클레임에서 나온다"를 구현한다.
    // 리소스 서버 스타터가 nimbus-jose-jwt(JwtDecoder/JwtEncoder)까지 함께 가져오므로
    // 별도 JWT 라이브러리를 추가하지 않는다.
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-resource-server'

    // 과제 스키마는 MySQL 기준. 로컬 검증 환경(MariaDB)도 함께 지원하기 위해 두 드라이버를 모두 포함한다.
    runtimeOnly 'com.mysql:mysql-connector-j'
    runtimeOnly 'org.mariadb.jdbc:mariadb-java-client'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
    systemProperty 'file.encoding', 'UTF-8'
    testLogging {
        events 'passed', 'failed', 'skipped'
        showStandardStreams = false
    }
}
